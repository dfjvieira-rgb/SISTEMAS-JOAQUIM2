<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SISTEMA JURÍDICO | MPU ELITE FINAL</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --mpu-green: #064e3b; --mpu-blue: #0c4a6e; --mpu-gold: #b45309;
            --bg-paper: #cbd5e1; --sidebar-w: 70px; --sucesso: #166534; --perigo: #991b1b;
            --juris: #4338ca; --redacao: #c2410c; --info: #0369a1;
        }
        body.dark-mode { --bg-paper: #0f172a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--mpu-blue); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        
        header { 
            background: linear-gradient(90deg, #001a33 0%, var(--mpu-green) 100%); 
            height: 60px; padding: 0 25px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 3px solid var(--mpu-gold); z-index: 5000; 
        }
        
        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* SIDEBAR COMPACTA ESTILO JOAQUIM ELITE */
        .sidebar { 
            width: var(--sidebar-w); background: #020617; display: flex; flex-direction: column; align-items: center;
            gap: 12px; padding: 20px 0; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; 
        }
        
        .btn-side { 
            width: 50px; height: 50px; border: none; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; 
            color: white; cursor: pointer; transition: 0.3s; 
            background: rgba(255,255,255,0.05); position: relative;
        }
        .btn-side:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); border-left: 3px solid var(--mpu-gold); }
        .btn-side i { font-size: 1.2rem; }

        /* TOOLTIP */
        .btn-side::after {
            content: attr(data-label); position: absolute; left: 65px; background: black; 
            color: white; padding: 5px 10px; border-radius: 4px; font-size: 10px; 
            white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 10000;
        }
        .btn-side:hover::after { opacity: 1; left: 75px; }

        /* CONTAINER DA FOLHA */
        .editor-container { 
            flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); 
            overflow-y: auto; align-items: center; padding: 20px 10px; transition: all 0.4s ease;
        }
        .editor-container.split-mode { padding: 10px; }

        .sticky-tools { 
            position: sticky; top: -20px; z-index: 1000; background: #fff; width: 100%; max-width: 850px; 
            border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 15px;
        }
        
        #identificador-peca { 
            padding: 12px; background: #f8fafc; text-align: left; padding-left: 20px; 
            font-weight: 800; color: var(--mpu-blue); border-bottom: 2px solid var(--mpu-gold); 
            cursor: pointer; font-size: 0.85rem; display: flex; justify-content: space-between;
        }
        
        .paper { 
            width: 100%; max-width: 850px; background: white; min-height: 1200px; 
            padding: 60px; color: #1e293b; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        #folha-total { outline: none; min-height: 900px; line-height: 1.6; font-size: 16px; text-align: justify; }

        /* VIEWER DE PDF COM DIVISÃO DE TELA */
        #pdf-viewer { 
            width: 0; background: #1e293b; transition: 0.4s ease-in-out; 
            display: flex; flex-direction: column; overflow: hidden; border-left: 0 solid var(--mpu-gold);
        }
        #pdf-viewer.active { width: 50%; border-left: 4px solid var(--mpu-gold); }
        #pdf-viewer.full-view { width: 100% !important; }

        .pdf-controls { 
            background: #001a33; padding: 10px 15px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 2px solid var(--mpu-gold);
        }
        .pdf-actions { display: flex; gap: 8px; }
        .btn-pdf-ctrl { background: rgba(255,255,255,0.1); border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-pdf-ctrl:hover { background: var(--mpu-gold); color: black; }

        iframe { flex: 1; border: none; background: white; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 110000; align-items: center; justify-content: center; padding: 20px; }
        .modal-body { background: white; width: 100%; max-width: 550px; padding: 25px; border-radius: 12px; color: #0f172a; max-height: 90vh; overflow-y: auto; }
        .opt-btn { width: 100%; padding: 12px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #ddd; background: #f8fafc; font-weight: 700; display: flex; justify-content: space-between; cursor: pointer; font-size: 0.75rem; align-items: center; color: var(--mpu-blue); }
        .opt-btn:hover { background: var(--mpu-blue); color: white; }

        @media (max-width: 768px) {
            #pdf-viewer.active { width: 100%; position: absolute; z-index: 6000; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-balance-scale"></i> ARSENAL MPU | <span>NÚCLEO DURO</span></div>
    <div style="display: flex; gap: 20px; align-items: center;">
        <div id="relogio" style="font-family: monospace; font-weight: bold; color: var(--mpu-gold);">00:00:00</div>
    </div>
</header>

<main>
    <aside class="sidebar">
        <button class="btn-side" data-label="SALVAR NA NUVEM" style="background:var(--sucesso);" onclick="window.salvarNasGavetas()"><i class="fas fa-save"></i></button>
        <button class="btn-side" data-label="MEUS ARQUIVOS" onclick="window.abrirGavetas()"><i class="fas fa-box-archive"></i></button>
        <div style="width: 30px; height: 1px; background: rgba(255,255,255,0.1); margin: 5px 0;"></div>
        <button class="btn-side" data-label="PROVAS E GABARITOS" style="background:var(--info);" onclick="window.abrirBibliotecaProvas()"><i class="fas fa-file-pdf"></i></button>
        <button class="btn-side" data-label="NÚCLEO DURO (LEIS)" onclick="window.abrirBibliotecaPDF()"><i class="fas fa-book-atlas"></i></button>
        <button class="btn-side" data-label="JURIS / STF / STJ" style="background:var(--juris);" onclick="window.abrirJurisprudencia()"><i class="fas fa-gavel"></i></button>
        <button class="btn-side" data-label="TREINO DISCURSIVO" style="background:var(--redacao);" onclick="window.abrirRedacao()"><i class="fas fa-pen-nib"></i></button>
        <button class="btn-side" data-label="NÃO CONFUNDA" style="background:#065f46;" onclick="window.inteligenciaNaoConfunda()"><i class="fas fa-lightbulb"></i></button>
        <div style="margin-top: auto;">
             <button class="btn-side" data-label="LIMPAR TELA" style="background:var(--perigo);" onclick="window.limparTela()"><i class="fas fa-eraser"></i></button>
        </div>
    </aside>

    <section class="editor-container" id="editor-ctx">
        <div class="sticky-tools">
            <div id="identificador-peca" onclick="window.renomear()">
                <span><i class="fas fa-file-contract"></i> <span id="titulo-atual">ESTUDO MPU: SEM TÍTULO</span></span>
                <span style="font-size: 10px; opacity: 0.7;">CLIQUE PARA RENOMEAR</span>
            </div>
        </div>
        <div class="paper">
            <div id="folha-total" contenteditable="true" spellcheck="false">
                <p style="text-align: center;"><b>MINISTÉRIO PÚBLICO DA UNIÃO</b></p>
                <p style="text-align: center; font-size: 12px;">SISTEMA INTEGRADO DE PREPARAÇÃO JURÍDICA</p>
                <hr style="margin: 20px 0;">
                <br>
            </div>
        </div>
    </section>

    <section id="pdf-viewer">
        <div class="pdf-controls">
            <span id="pdf-title" style="font-size: 10px;">CONSULTA</span>
            <div class="pdf-actions">
                <button class="btn-pdf-ctrl" onclick="window.toggleFullPDF()" title="Alternar Cheia/Dividida"><i class="fas fa-expand-alt"></i></button>
                <button class="btn-pdf-ctrl" style="background:var(--perigo);" onclick="window.fecharPDF()"><i class="fas fa-times"></i> FECHAR</button>
            </div>
        </div>
        <iframe id="pdf-frame" src=""></iframe>
    </section>
</main>

<div class="modal" id="modal-base">
    <div class="modal-body">
        <h2 id="modal-title" style="margin-bottom:20px; border-bottom:3px solid var(--mpu-green); padding-bottom:10px; font-size:1.1rem; color:var(--mpu-blue)"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('modal-base').style.display='none'" style="width:100%; padding:12px; background:#000; color:white; border-radius:6px; margin-top:20px; cursor:pointer; border:none;">FECHAR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ",
        authDomain: "masteroab-db5e1.firebaseapp.com",
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com",
        projectId: "masteroab-db5e1",
        storageBucket: "masteroab-db5e1.appspot.com",
        messagingSenderId: "620234160245",
        appId: "1:620234160245:web:8651817c66144e59f42668"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.pecaNome = "ESTUDO MPU: SEM TÍTULO";

    const BIBLIOTECA_TREINO = [
        { n: "PROVA ANALISTA (FGV 2025)", u: "AnalistaMPU.pdf" },
        { n: "GABARITO ANALISTA (FGV 2025)", u: "AnalistaMPU_Gabarito.pdf" },
        { n: "PROVA ANALISTA (CESPE)", u: "mpu10_045.pdf" },
        { n: "GABARITO ANALISTA (CESPE)", u: "gabaritos_mpu45.pdf" }
    ];

    const NUCLEO_DURO = [
        { n: "CF/88", t: "Constituição Federal", u: "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" },
        { n: "LC 75/93", t: "Lei Orgânica do MPU", u: "https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp75.htm" },
        { n: "L. 8.429", t: "Improbidade Administrativa", u: "https://www.planalto.gov.br/ccivil_03/leis/l8429.htm" }
    ];

    // FUNÇÕES DE ABERTURA COM DIVISÃO DE TELA
    window.abrirNoViewer = (url, titulo) => {
        const viewer = document.getElementById('pdf-viewer');
        const editor = document.getElementById('editor-ctx');
        document.getElementById('pdf-frame').src = url;
        document.getElementById('pdf-title').innerText = titulo;
        
        viewer.classList.add('active');
        editor.classList.add('split-mode');
        document.getElementById('modal-base').style.display = 'none';
    };

    window.toggleFullPDF = () => {
        const viewer = document.getElementById('pdf-viewer');
        viewer.classList.toggle('full-view');
    };

    window.fecharPDF = () => {
        const viewer = document.getElementById('pdf-viewer');
        const editor = document.getElementById('editor-ctx');
        viewer.classList.remove('active', 'full-view');
        editor.classList.remove('split-mode');
        document.getElementById('pdf-frame').src = "";
    };

    window.abrirBibliotecaProvas = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "BIBLIOTECA DE TREINO";
        content.innerHTML = "";
        BIBLIOTECA_TREINO.forEach(p => {
            const d = document.createElement('div'); d.className = 'opt-btn';
            d.innerHTML = `<span><i class="fas fa-file-pdf"></i> ${p.n}</span>`;
            d.onclick = () => window.abrirNoViewer(p.u, p.n);
            content.appendChild(d);
        });
        modal.style.display = 'flex';
    };

    window.abrirBibliotecaPDF = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "NÚCLEO DURO MPU";
        content.innerHTML = "";
        NUCLEO_DURO.forEach(lei => {
            const d = document.createElement('div'); d.className = 'opt-btn';
            d.innerHTML = `<span><b>${lei.n}</b> - ${lei.t}</span>`;
            d.onclick = () => window.abrirNoViewer(lei.u, lei.n);
            content.appendChild(d);
        });
        modal.style.display = 'flex';
    };

    // LOGICA DE SALVAMENTO NUVEM
    window.salvarNasGavetas = async () => {
        const conteudo = document.getElementById('folha-total').innerHTML;
        const finalKey = Date.now().toString();
        await set(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/PECAS/${finalKey}`), { 
            nome: window.pecaNome, 
            data: new Date().toLocaleString(), 
            conteudo: conteudo 
        });
        alert("Sincronizado na Nuvem!");
    };

    window.abrirGavetas = async () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "MEUS ARQUIVOS";
        content.innerHTML = "Carregando...";
        const snap = await get(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/PECAS`));
        content.innerHTML = "";
        if (snap.exists()) {
            Object.values(snap.val()).reverse().forEach(item => {
                const btn = document.createElement('div'); btn.className = 'opt-btn';
                btn.innerHTML = `<span>${item.nome} <br><small>${item.data}</small></span>`;
                btn.onclick = () => { 
                    document.getElementById('folha-total').innerHTML = item.conteudo; 
                    window.pecaNome = item.nome;
                    document.getElementById('titulo-atual').innerText = item.nome;
                    modal.style.display = 'none';
                };
                content.appendChild(btn);
            });
        } else { content.innerHTML = "Gaveta vazia."; }
        modal.style.display = 'flex';
    };

    window.inteligenciaNaoConfunda = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "INTELIGÊNCIA: NÃO CONFUNDA";
        const dicas = [
            { t: "MPU vs. MPE", d: "MPU é Federal (MPF, MPT, MPM, MPDFT). MPE é Estadual." },
            { t: "PGR Mandato", d: "2 anos, reconduções ilimitadas (na teoria), aprovado pelo Senado." }
        ];
        content.innerHTML = "";
        dicas.forEach(d => {
            const b = document.createElement('div'); b.className = 'opt-btn';
            b.innerHTML = `<span><b>${d.t}</b></span>`;
            b.onclick = () => { 
                document.getElementById('folha-total').innerHTML += `<div style="background:#fef9c3; padding:15px; border-left:5px solid #b45309; margin:10px 0;"><b>NÃO CONFUNDA:</b> ${d.d}</div>`;
                modal.style.display = 'none';
            };
            content.appendChild(b);
        });
        modal.style.display = 'flex';
    };

    // UTILITARIOS
    window.renomear = () => { 
        const n = prompt("NOME DO ESTUDO:", window.pecaNome); 
        if(n) { window.pecaNome = n.toUpperCase(); document.getElementById('titulo-atual').innerText = n; } 
    };
    window.limparTela = () => confirm("Limpar tudo?") && (document.getElementById('folha-total').innerHTML = "");
    window.abrirJurisprudencia = () => window.open("https://portal.stf.jus.br/informativo/", "_blank");
    window.abrirRedacao = () => {
        document.getElementById('folha-total').innerHTML = "<h2>TEMA DE REDAÇÃO</h2><hr><p>Desenvolva aqui...</p>";
        alert("Folha preparada para redação.");
    };

    setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString('pt-BR'); }, 1000);
</script>
</body>
</html>
